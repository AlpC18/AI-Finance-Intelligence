# Render Blueprint: FastAPI (multi-worker) + managed PostgreSQL + Redis.
databases:
  - name: ai-finance-db
    plan: starter
    postgresMajorVersion: "16"
    # pgvector is available on Render Postgres 16; enable once with
    #   CREATE EXTENSION IF NOT EXISTS vector;
    # (reserved for future persistent RAG embeddings; relational data works as-is).

services:
  - type: redis
    name: ai-finance-redis
    plan: starter
    maxmemoryPolicy: noeviction
    ipAllowList: []  # reachable only from services in this Render account

  - type: web
    name: ai-finance-intelligence
    runtime: docker
    plan: starter
    dockerfilePath: ./Dockerfile
    # Readiness, so a deploy is only promoted once the instance can reach
    # its database - /health answers 200 from a process that cannot serve.
    healthCheckPath: /health/ready
    autoDeploy: true
    # Apply DB migrations before each release; boot is gated by the app preflight.
    preDeployCommand: alembic upgrade head
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: WEB_CONCURRENCY
        value: "4"
      - key: CACHE_BACKEND
        value: redis
      # --- Datastores ---
      - key: DATABASE_URL
        fromDatabase:
          name: ai-finance-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: ai-finance-redis
          property: connectionString
      # --- Auth (JWT) ---
      - key: JWT_SECRET
        generateValue: true          # strong secret; never a placeholder
      - key: JWT_ALGORITHM
        value: HS256
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: "15"
      - key: REFRESH_TOKEN_EXPIRE_DAYS
        value: "7"
      # --- Encryption at rest (Fernet). Set a REAL key in the dashboard: ---
      #   python -c "from cryptography.fernet import Fernet; print(Fernet.generate_key().decode())"
      # Rotate by prepending a new key: ENCRYPTION_KEY=<new>,<old>
      - key: ENCRYPTION_KEY
        sync: false
      # --- Secrets set in the dashboard, not committed ---
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: AI_MODEL
        value: claude-sonnet-4-6
      - key: RATE_LIMIT_AI
        value: 30/minute
      - key: RATE_LIMIT_TRADE
        value: 10/minute
      # --- Broker execution (paper by default) ---
      - key: ALPACA_BASE_URL
        value: https://paper-api.alpaca.markets
      - key: TRADING_MODE
        value: paper
